name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release verification
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCGUARD_BUILD_TESTS=ON
          -DCGUARD_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
