name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
        build_type: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        run: >
          cmake -S . -B build
          -DCGUARD_BUILD_TESTS=ON
          -DCGUARD_BUILD_EXAMPLES=ON
          -DCGUARD_STRICT_WARNINGS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  macos:
    name: macOS AppleClang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCGUARD_BUILD_TESTS=ON
          -DCGUARD_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  windows:
    name: Windows MSVC result-only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCGUARD_BUILD_TESTS=ON
          -DCGUARD_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build --parallel --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
